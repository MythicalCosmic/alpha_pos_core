[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha_pos_core"
version = "0.1.0"
description = "Shared spine for Alpha POS: core models, auth, the sync engine, and the business apps used by BOTH the server and local (desktop) editions."
requires-python = ">=3.11"

dependencies = [
    "Django==6.0.3",
    "asgiref==3.11.1",
    "sqlparse==0.5.5",
    "tzdata==2025.2",
    "channels>=4.1",
    "redis==7.3.0",
    "django-redis==6.0.0",
    "requests==2.32.5",
    "cryptography>=48,<50",
    "psycopg[binary]>=3.2",
    "django-cors-headers==4.9.0",
    "whitenoise==6.8.2",
    "anthropic==0.74.0",
    "google-genai==2.7.0",
    "openai==2.43.0",
]

[tool.setuptools.packages.find]
include = [
    "base*", "stock*", "hr*", "discounts*", "cashbox*", "fiscalization*",
    "licensing*", "notifications*", "core*", "alpha_pos_core*",
]

[tool.setuptools.package-data]
"*" = ["**/*.html", "**/*.json", "**/*.txt", "**/*.css", "**/*.js", "**/*.png", "**/*.ico", "**/*.svg"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alpha_pos_core/asgi.py" = ["E402"]
"stock/views/__init__.py" = ["F403"]
